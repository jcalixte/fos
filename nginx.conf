server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The one socket a two-Commander battle is fought over, handed to the Bun
  # process beside this one. It is the only thing here that is not a static
  # file. It beats the SPA fallback on prefix length rather than on order —
  # without it `try_files` would answer an upgrade request with index.html.
  #
  # The read timeout is long on purpose: a battle runs for forty minutes of
  # Scenario clock and a Commander who has gone Out of Contact is still holding
  # a seat, so the proxy must not be the thing that decides he has left (F24).
  location /ws {
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
