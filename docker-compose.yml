# Two images, which is the honest cost of two runtimes in one repo (ADR-0014):
# Vite and vue-tsc build the site, Bun runs the server. Solo play needs only
# `web` — that is F19's static half, and it is what keeps the answer to "does
# this still work as a static site" yes.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    # Exposed, not published. The host's port 80 is held by the proxy that
    # terminates fos.apoena.dev, so binding it here fails the deploy outright;
    # the proxy reaches this container over the compose network instead.
    expose:
      - "80"
    # A stopped container is a dead site nobody is told about. This is what was
    # missing when the SPA went down on 4 September and stayed down.
    restart: unless-stopped
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      # Where the Scenarios are read from, inside the image.
      SCENARIO_ROOT: public
      # One record per battle, appended here and kept across deploys — a
      # container's own log is wiped by the next push, which is no place for
      # the thing you go looking for after an afternoon has gone wrong.
      RECORD_PATH: /record/battles.jsonl
      # A named volume has no size of its own, so the bound is the writer's:
      # a month of battles, and 16MB whatever a month turns out to hold.
      RECORD_KEEP_DAYS: "30"
      RECORD_MAX_BYTES: "16777216"
    volumes:
      - record:/record
    expose:
      - "8787"
    restart: unless-stopped

volumes:
  record:
